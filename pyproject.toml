[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemapilot"
version = "0.1.0"
description = "SchemaPilot: AI-Native Terminal Database Client & Console Co-pilot"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "sqlglot>=30.13,<31",
    "langchain-core>=0.1.30",
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0"
]

[project.optional-dependencies]
trino = ["trino[sqlalchemy]>=0.330"]
clickhouse = ["clickhouse-connect>=0.8"]
duckdb = ["duckdb-engine>=0.13"]
all = [
    "trino[sqlalchemy]>=0.330",
    "clickhouse-connect>=0.8",
    "duckdb-engine>=0.13",
]
dev = [
    "pytest>=7.0.0",
    "duckdb-engine>=0.13",
]

[project.scripts]
schemapilot = "schemapilot.cli:main"

[tool.setuptools.packages.find]
include = ["schemapilot*"]
